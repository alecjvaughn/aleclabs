apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aleclabs-home
  namespace: argocd
spec:
  project: aleclabs
  source:
    repoURL: 'https://github.com/alecjvaughn/aleclabs.git'
    targetRevision: HEAD
    path: k8s/base
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
