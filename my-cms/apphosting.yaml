# Configures the runtime environment for Firebase App Hosting.
# Justification: Defines Cloud Run settings and injects necessary secrets/env vars.
# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
# env:
  # Configure environment variables.
  # See https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
  # - variable: MESSAGE
  #   value: Hello world!
  #   availability:
  #     - BUILD
  #     - RUNTIME

  # Grant access to secrets in Cloud Secret Manager.
  # See https://firebase.google.com/docs/app-hosting/configure#secret-parameters
  # - variable: MY_SECRET
  #   secret: mySecretRef
env:
  # Dependency: Requires 'firebase_API_Key' to exist in Google Cloud Secret Manager.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: firebase_API_Key
    availability:
      - BUILD
      - RUNTIME
