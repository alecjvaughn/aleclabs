name: Deploy Application to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: aleclabs-website # Your Google Cloud project ID
  SERVICE: nextjs-app-service # The name of your Cloud Run service
  REGION: us-central1 # The region of your Cloud Run service

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Authorize Docker push
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/images/app/Dockerfile
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/nextjs-repo/my-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        run: >-
          gcloud run deploy ${{ env.SERVICE }}
          --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/nextjs-repo/my-app:latest
          --region ${{ env.REGION }}
          --platform managed
          --allow-unauthenticated