name: Deploy Application to Cloud Run

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  push:
    branches:
      - main

env:
  PROJECT_ID: aleclabs-website # Your Google Cloud project ID
  SERVICE: nextjs-app-service # The name of your Cloud Run service
  REGION: us-central1 # The region of your Cloud Run service

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      # Required to checkout the code
      contents: 'read'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Authorize Docker push
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Root Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/images/root/Dockerfile
          tags: local/root_base:latest
          load: true # Load the image into the local Docker daemon for the next step
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Middleware Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/images/middleware/Dockerfile
          tags: local/node_middleware:latest
          load: true # Load the image into the local Docker daemon for the next step
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/images/app/Dockerfile
          push: true
          # Tag with the Git SHA for unique, traceable builds instead of overwriting 'latest'
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/nextjs-repo/my-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Production (main branch)
        # Only run this step automatically for the 'main' branch to protect production
        if: github.ref == 'refs/heads/main'
        run: >-
          gcloud run deploy ${{ env.SERVICE }}
          # Deploy the specific image version that was just built
          --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/nextjs-repo/my-app:${{ github.sha }}
          --region ${{ env.REGION }}
          --platform managed
          --allow-unauthenticated

      - name: Sanitize branch name for preview service
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        id: sanitize
        run: |
          # Cloud Run service names must be lowercase, start with a letter, and contain only letters, numbers, and hyphens.
          BRANCH_NAME=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | cut -c1-40)
          echo "PREVIEW_SERVICE_NAME=preview-${BRANCH_NAME}" >> $GITHUB_ENV

      - name: Deploy Preview Environment (dev branches)
        if: steps.sanitize.conclusion == 'success'
        run: >-
          gcloud run deploy ${{ env.PREVIEW_SERVICE_NAME }}
          --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/nextjs-repo/my-app:${{ github.sha }}
          --region ${{ env.REGION }}
          --platform managed
          --allow-unauthenticated